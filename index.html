<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RB Engine - لوحة التحكم</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 50px; }
        .container { background: #1e1e1e; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        h1 { color: #00ffcc; }
        input { padding: 10px; width: 80%; margin: 10px 0; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #00ffcc; color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>RB Engine Loader</h1>
        <p>لوحة تحكم مفاتيح التفعيل - 8 Ball Pool</p>
        <input type="text" id="keyInput" placeholder="أدخل مفتاح التفعيل...">
        <br><br>
        <button onclick="alert('جاري التحقق من المفتاح...')">تفعيل اللودر</button>
    </div>
</body>
</html>
